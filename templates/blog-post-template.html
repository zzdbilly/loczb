<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{OG_URL}}">
    <meta property="og:type" content="article">
        <meta property="og:image" content="../../assets/images/og-image.png">
    <meta property="og:site_name" content="loczb">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">

    
    {{JSON_LD}}
    
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/article.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'">
    <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
    <link rel="alternate icon" href="../../assets/images/favicon.ico">
</head>
<body>
  <!-- Loading -->
  <div class="loading">
    <div class="loading-spinner"></div>
  </div>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="../../index.html" class="nav-logo">
        loc<span>zb</span>
      </a>
      <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="nav-links-menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-overlay"></div>
      <ul class="nav-links" id="nav-links-menu">
        <li><a href="../../index.html" class="nav-link">首页</a></li>
        <li><a href="../../projects/index.html" class="nav-link">项目</a></li>
        <li><a href="../index.html" class="nav-link active">博客</a></li>
        <li><a href="../../about/index.html" class="nav-link">关于</a></li>
      </ul>
    </div>
  </nav>
  <!-- Particle Canvas Background -->
  <canvas id="particle-canvas" class="particle-canvas"></canvas>

  <div class="scroll-progress"></div>

  <main class="section" style="padding-bottom: 0;">
    <div class="container container-narrow">
      <a href="../index.html" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回博客列表
      </a>

      <article class="post-content">
        <h1>{{ARTICLE_TITLE}}</h1>
        
        <div class="post-meta">
          <span>📅 {{ARTICLE_DATE}}</span>
          <span>⏱️ {{ARTICLE_READ_TIME}}</span>
          <span>👤 张小猛</span>
        </div>
        
        <div class="post-tags">
          {{ARTICLE_TAGS}}
        </div>
        
        {{ARTICLE_CONTENT}}
      </article>
    </div>
  </main>

  <!-- Related Posts / Navigation -->
  <section class="section" style="padding-top: 0;">
    <div class="container container-narrow">
      <hr style="border: none; border-top: 1px solid var(--color-border); margin: var(--space-3xl) 0;">
      
      <div class="blog-topics" style="margin-bottom: var(--space-xl);">
        <span class="topic-label">读完之后：</span>
        <a href="../index.html" class="topic-tag">返回博客列表</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-signature">写代码，做产品，也认真生活。</p>
      <div class="footer-links">
        <a href="https://github.com/zzdbilly" class="footer-link" target="_blank" rel="noopener">GitHub</a>
        <a href="../../projects/index.html" class="footer-link">项目</a>
        <a href="../../about/index.html" class="footer-link">关于</a>
      </div>
      <p class="footer-copyright">
        &copy; 2026 张小猛
      </p>
    </div>
  </footer>

  
  <script defer src="../../assets/js/related-posts.js"></script>
  <script defer src="../../assets/js/share.js"></script>
  <script defer src="../../assets/js/main.js"></script>
  <script defer src="../../assets/js/article.js"></script>

  <!-- Back to Top & Reading Progress -->
  <button class="back-to-top" id="backToTop" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </button>
  <div class="reading-progress" id="readingProgress"></div>

  <!-- Post TOC -->
  <div class="post-toc-container" id="postToc">
    <nav class="post-toc">
      <div class="post-toc-title">目录</div>
      <ul class="post-toc-list" id="tocList">
      </ul>
    </nav>
  </div>
<script defer src="../../assets/js/particles.js"></script>

  <!-- Cloudflare Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "29e7cff6f37448989538e2165cb79187"}'></script>
</body>
</html>
