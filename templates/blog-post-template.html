<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{OG_URL}}">
    <meta property="og:type" content="article">
    <meta property="og:image" content="../../assets/images/og-default.webp">
    <meta property="og:site_name" content="loczb">
    
    {{JSON_LD}}
    
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>{{INLINE_STYLES}}</style>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="alternate icon" href="../../favicon.ico">
</head>
<body>
  <!-- Loading -->
  <div class="loading">
    <div class="loading-spinner"></div>
  </div>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="../../index.html" class="nav-logo">
        loc<span>zb</span>
      </a>
      <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="nav-links-menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-overlay"></div>
      <ul class="nav-links" id="nav-links-menu">
        <li><a href="../../index.html" class="nav-link">首页</a></li>
        <li><a href="../../projects/index.html" class="nav-link">项目</a></li>
        <li><a href="../index.html" class="nav-link active">博客</a></li>
        <li><a href="../../about/index.html" class="nav-link">关于</a></li>
      </ul>
    </div>
  </nav>

  <div class="scroll-progress"></div>

  <main class="section" style="padding-bottom: 0;">
    <div class="container container-narrow">
      <a href="../index.html" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回博客列表
      </a>

      <article class="post-content">
        {{ARTICLE_CONTENT}}
      </article>
    </div>
  </main>

  <!-- Related Posts / Navigation -->
  <section class="section" style="padding-top: 0;">
    <div class="container container-narrow">
      <hr style="border: none; border-top: 1px solid var(--color-border); margin: var(--space-3xl) 0;">
      
      <div class="blog-topics" style="margin-bottom: var(--space-xl);">
        <span class="topic-label">读完之后：</span>
        <a href="../index.html" class="topic-tag">返回博客列表</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-signature">写代码，做产品，也认真生活。</p>
      <div class="footer-links">
        <a href="https://github.com/zzdbilly" class="footer-link" target="_blank" rel="noopener">GitHub</a>
        <a href="../../projects/index.html" class="footer-link">项目</a>
        <a href="../../about/index.html" class="footer-link">关于</a>
      </div>
      <p class="footer-copyright">
        &copy; 2026 张小猛
      </p>
    </div>
  </footer>

  
  <script src="../../assets/js/related-posts.js"></script>
  <script src="../../assets/js/share.js"></script>
  <script src="../../assets/js/main.js"></script>

  <!-- Back to Top & Reading Progress -->
  <button class="back-to-top" id="backToTop" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </button>
  <div class="reading-progress" id="readingProgress"></div>

  <script>
    const backToTop = document.getElementById("backToTop");
    
    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        backToTop.classList.add("visible");
      } else {
        backToTop.classList.remove("visible");
      }
      
      const progressBar = document.getElementById("readingProgress");
      if (progressBar && document.querySelector(".post-content")) {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const progress = (scrollTop / docHeight) * 100;
        progressBar.style.width = progress + "%";
      }
    });
    
    backToTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.key === "j") window.scrollBy({ top: 200, behavior: "smooth" });
      else if (e.key === "k") window.scrollBy({ top: -200, behavior: "smooth" });
      else if (e.key === "Escape") document.getElementById("blog-search-results")?.classList.remove("active");
      else if (e.altKey && e.key === "b") window.location.href = "../index.html";
    });
  </script>

  <!-- Post TOC -->
  <div class="post-toc-container" id="postToc">
    <nav class="post-toc">
      <div class="post-toc-title">目录</div>
      <ul class="post-toc-list" id="tocList">
      </ul>
    </nav>
  </div>

  <script>
    (function() {
      const tocList = document.getElementById('tocList');
      const tocContainer = document.getElementById('postToc');
      if (!tocList || !tocContainer) return;
      
      const headings = document.querySelectorAll('.post-content h2, .post-content h3');
      if (headings.length === 0) { tocContainer.style.display = 'none'; return; }
      
      headings.forEach((h, i) => {
        const id = 'toc-' + i;
        h.id = h.id || id;
        
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent.replace(/^\d+[.、]\s*/, '');
        a.className = h.tagName === 'H3' ? 'toc-h3' : 'toc-h2';
        
        a.addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById(h.id).scrollIntoView({ behavior: 'smooth' });
          history.pushState(null, '', '#' + h.id);
        });
        
        li.appendChild(a);
        tocList.appendChild(li);
      });
      
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            tocList.querySelectorAll('a').forEach(a => a.classList.remove('active'));
            const id = entry.target.id;
            const activeLink = tocList.querySelector('a[href="#' + id + '"]');
            if (activeLink) {
              activeLink.classList.add('active');
              activeLink.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }
        });
      }, { rootMargin: '-20% 0px -60% 0px' });
      
      headings.forEach(h => observer.observe(h));
    })();
  </script>
</body>
</html>
