  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">

  <link rel="manifest" href="../site.webmanifest">

  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 3rem; padding: 2rem 0; }
    .pagination-btn { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg-secondary); color: var(--color-text-secondary); text-decoration: none; font-size: 0.9rem; transition: all 0.2s; }
    .pagination-btn:hover { background: var(--color-bg-tertiary); border-color: var(--color-border-hover); color: var(--color-text-primary); }
    .pagination-btn.disabled { opacity: 0.5; pointer-events: none; }
    .pagination-btn.active { background: var(--color-accent-primary); border-color: var(--color-accent-primary); color: white; }
    .pagination-info { color: var(--color-text-secondary); font-size: 0.85rem; margin: 0 1rem; }
  </style>
</head>
<body>
  <!-- Loading -->
  <div class="loading">
    <div class="loading-spinner"></div>
  </div>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">loc<span>zb</span></a>
      <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="nav-links-menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-overlay"></div>
      <ul class="nav-links" id="nav-links-menu">
        <li><a href="../index.html" class="nav-link">首页</a></li>
        <li><a href="../projects/index.html" class="nav-link">项目</a></li>
        <li><a href="index.html" class="nav-link active">博客</a></li>
        <li><a href="../about/index.html" class="nav-link">关于</a></li>
      </ul>
      <button class="theme-toggle" aria-label="切换主题" title="切换亮/暗模式">
        <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
        <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </nav>

  <!-- Hero -->
  <main id="main-content">
  <section class="blog-hero">
    <div class="container">
      <div class="section-header">
        <div class="section-label">Blog</div>
        <h1 class="section-title">技术博客</h1>
        <p class="section-desc">我的技术文章、学习笔记与思考</p>
      </div>
      
      <!-- Filters -->
      <div class="blog-filters">
        <button class="filter-btn filter-btn-active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="前端">前端</button>
        <button class="filter-btn" data-filter="Android">Android</button>
        <button class="filter-btn" data-filter="AI">AI</button>
        <button class="filter-btn" data-filter="DevOps">DevOps</button>
      </div>
    </div>
  </section>

  <!-- Blog Posts List -->
  <section class="section section-narrow">
    <div class="container">
      <div class="section-header">
        <div class="section-label">Archive</div>
        <h2 class="section-title">全部文章</h2>
      </div>
      
      <div class="blog-list-container" id="blog-list-container">
        <!-- 动态加载 -->
        <div class="text-center py-8">加载中...</div>
      </div>

      <!-- 分页 -->
      <div class="pagination" id="pagination"></div>
    </div>
  </section>
  </main>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <div class="footer-inner">
      <p class="footer-signature">写代码，做产品，也认真生活。</p>
      <div class="footer-links">
        <a href="https://github.com/zzdbilly" class="footer-link" target="_blank" rel="noopener">GitHub</a>
        <a href="../projects/index.html" class="footer-link">项目</a>
        <a href="../about/index.html" class="footer-link">关于</a>
      </div>
      <p class="footer-copyright">© 2026 张小猛</p>
    </div>
  </footer>

  <script src="../assets/js/main.js"></script>
  <script>
    // 博客列表分页
    const POSTS_PER_PAGE = 10;
    let allArticles = [];
    let currentPage = 1;
    let currentFilter = 'all';

    // 获取 URL 参数
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        page: parseInt(params.get('page')) || 1,
        filter: params.get('filter') || 'all'
      };
    }

    // 更新 URL 参数
    function updateUrlParams(page, filter) {
      const params = new URLSearchParams();
      if (page > 1) params.set('page', page);
      if (filter !== 'all') params.set('filter', filter);
      
      const newUrl = params.toString() ? '?' + params.toString() : window.location.pathname;
      window.history.pushState({ page, filter }, '', newUrl);
    }

    // 渲染文章列表
    function renderPosts(articles, page) {
      const container = document.getElementById('blog-list-container');
      const start = (page - 1) * POSTS_PER_PAGE;
      const end = start + POSTS_PER_PAGE;
      const posts = articles.slice(start, end);

      if (posts.length === 0) {
        container.innerHTML = '<div class="text-center py-8">暂无文章</div>';
        return;
      }

      container.innerHTML = posts.map(post => {
        const category = (post.category || '其他').split(',')[0].trim();
        const tags = (post.tags || []).slice(0, 2).map(t => 
          `<span class="tech-tag">${t}</span>`
        ).join('');
        
        return `<article class="blog-list-item animate-on-scroll" data-category="${category}">
          <div class="blog-list-header">
            <div class="blog-list-meta">
              <span class="blog-date">${post.date}</span>
              <span>·</span>
              <span class="blog-read-time">${post.readTime || '10 min'}</span>
            </div>
            <span class="blog-list-tag">${category}</span>
          </div>
          <h3 class="blog-list-title">
            <a href="${post.url}">${post.title.replace(/ \| 张小猛 - loczb$/, '')}</a>
          </h3>
          <p class="blog-list-excerpt">${post.excerpt || ''}</p>
        </article>`;
      }).join('');
    }

    // 渲染分页
    function renderPagination(totalPages, page) {
      const container = document.getElementById('pagination');
      
      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '';
      
      // 上一页
      html += `<a href="?page=${page - 1}${currentFilter !== 'all' ? '&filter=' + currentFilter : ''}" 
        class="pagination-btn ${page === 1 ? 'disabled' : ''}">← 上一页</a>`;
      
      // 页码
      html += `<span class="pagination-info">第 ${page} / ${totalPages} 页</span>`;
      
      // 下一页
      html += `<a href="?page=${page + 1}${currentFilter !== 'all' ? '&filter=' + currentFilter : ''}" 
        class="pagination-btn ${page === totalPages ? 'disabled' : ''}">下一页 →</a>`;

      container.innerHTML = html;
    }

    // 筛选功能
    function setupFilters() {
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('filter-btn-active'));
          btn.classList.add('filter-btn-active');
          
          const filter = btn.dataset.filter;
          currentFilter = filter;
          currentPage = 1;
          
          const filtered = filter === 'all' 
            ? allArticles 
            : allArticles.filter(a => a.category === filter);
          
          const totalPages = Math.ceil(filtered.length / POSTS_PER_PAGE);
          renderPosts(filtered, currentPage);
          renderPagination(totalPages, currentPage);
          updateUrlParams(currentPage, filter);
        });
      });
    }

    // 初始化
    async function init() {
      try {
        const res = await fetch('articles.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        allArticles = await res.json();
        
        // 规范化 category 字段
        allArticles = allArticles.map(a => ({
          ...a,
          category: (a.category || '其他').split(',')[0].trim()
        }));
        
        const { page, filter } = getUrlParams();
        currentPage = page;
        currentFilter = filter;
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.classList.toggle('filter-btn-active', btn.dataset.filter === filter);
        });

        const filtered = filter === 'all' 
          ? allArticles 
          : allArticles.filter(a => a.category === filter);
        
        const totalPages = Math.ceil(filtered.length / POSTS_PER_PAGE);
        renderPosts(filtered, currentPage);
        renderPagination(totalPages, currentPage);
        setupFilters();
      } catch (err) {
        console.error('加载文章失败:', err);
        document.getElementById('blog-list-container').innerHTML = 
          '<div class="text-center py-8">加载失败</div>';
      }
    }

    // 处理浏览器后退
    window.addEventListener('popstate', (e) => {
      if (e.state) {
        currentPage = e.state.page;
        currentFilter = e.state.filter;
        const filtered = currentFilter === 'all' 
          ? allArticles 
          : allArticles.filter(a => a.category === currentFilter);
        const totalPages = Math.ceil(filtered.length / POSTS_PER_PAGE);
        renderPosts(filtered, currentPage);
        renderPagination(totalPages, currentPage);
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.classList.toggle('filter-btn-active', btn.dataset.filter === currentFilter);
        });
      }
    });

    // DOM 加载完成后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
