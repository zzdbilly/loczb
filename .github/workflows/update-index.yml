name: Update Blog Index & Cache Hash

on:
  push:
    branches: [main]
    paths:
      - 'blog/posts/**'
      - 'blog/index.html'
      - 'index.html'
      - 'about/index.html'
      - 'projects/index.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - '404.html'

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate blog index
        run: node scripts/generate-index.js

      - name: Update cache-busting hashes
        run: |
          node -e '
          const fs = require("fs");
          const crypto = require("crypto");
          const path = require("path");

          function fileHash(filePath) {
            const content = fs.readFileSync(filePath);
            return crypto.createHash("md5").update(content).digest("hex").slice(0, 8);
          }

          function updateHtmlFile(htmlPath) {
            if (!fs.existsSync(htmlPath)) return;
            let html = fs.readFileSync(htmlPath, "utf-8");
            const dir = path.dirname(htmlPath);
            let changed = false;

            // Replace ?v=xxx with content hash for local CSS/JS
            html = html.replace(/(\.\.\/)+(assets\/(?:css|js)\/[^"?]+)\?v=[a-f0-9]+/g, (match, prefix, assetPath) => {
              const fullPath = path.join(dir, prefix, assetPath);
              if (fs.existsSync(fullPath)) {
                const hash = fileHash(fullPath);
                changed = true;
                return prefix + assetPath + "?v=" + hash;
              }
              return match;
            });

            // Also handle without prefix (same dir)
            html = html.replace(/(assets\/(?:css|js)\/[^"?]+)\?v=[a-f0-9]+/g, (match, assetPath) => {
              const fullPath = path.join(dir, assetPath);
              if (fs.existsSync(fullPath)) {
                const hash = fileHash(fullPath);
                changed = true;
                return assetPath + "?v=" + hash;
              }
              return match;
            });

            if (changed) {
              fs.writeFileSync(htmlPath, html);
              console.log("  ✅ Updated hashes in " + htmlPath);
            }
          }

          // Update all HTML files
          const htmlFiles = [
            "index.html",
            "blog/index.html",
            "about/index.html",
            "projects/index.html",
            "404.html"
          ];

          htmlFiles.forEach(f => updateHtmlFile(f));
          console.log("Done!");
          '

      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "chore: auto-update blog index & cache hashes"
          git push
