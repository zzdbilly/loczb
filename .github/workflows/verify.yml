name: Verify & Link Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          pip install -r requirements.txt

      - name: Run unit and regression tests
        run: npm test

      - name: Rebuild posts from Markdown sources
        run: npm run build:posts

      - name: Ensure generated artifacts match committed files
        run: git diff --exit-code

      - name: Run verification gate checks
        run: npm run verify

      - name: Run dead link and asset inspection
        run: npm run check-links
