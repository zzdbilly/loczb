name: Verify & Link Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pip install -r requirements.txt

      - name: Run unit and regression tests
        run: pnpm run test

      - name: Rebuild posts from Markdown sources
        run: pnpm run build:posts

      - name: Ensure generated artifacts match committed files
        run: |
          git add -A
          if ! git diff --cached --exit-code; then
            echo "::error::重建产物与提交文件不一致（改产物不改源会红）"
            echo "----- git status --porcelain -----"
            git status --porcelain
            echo "----- git diff --cached --stat -----"
            git diff --cached --stat
            exit 1
          fi

      - name: Run verification gate checks
        run: pnpm run verify

      - name: Run dead link and asset inspection
        run: pnpm run check-links
