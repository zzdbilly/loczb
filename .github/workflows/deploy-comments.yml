name: Deploy Comments
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-comments.yml'
      - 'workers/comment-system/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/comment-system
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev --ignore-scripts --no-fund --no-audit

      - name: Ensure D1 database exists & apply schema
        run: |
          # 创建 D1 数据库（幂等，已存在时忽略错误）
          npx wrangler d1 create loczb-comments 2>&1 || true
          # 执行数据库 schema
          npx wrangler d1 execute loczb-comments --remote --file=schema.sql 2>&1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
