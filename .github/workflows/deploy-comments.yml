name: Deploy Comments
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-comments.yml'
      - 'workers/comment-system/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/comment-system
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev --ignore-scripts --no-fund --no-audit

      - name: Ensure D1 database exists & apply schema
        run: |
          set -x
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          npx wrangler d1 list 2>&1 || true
          # 创建数据库（如果已存在则忽略错误）
          npx wrangler d1 create loczb-comments 2>&1 || true
          # 等待数据库就绪后执行 schema（重试最多 3 次）
          for i in 1 2 3; do
            echo "Attempt $i: applying schema..."
            npx wrangler d1 execute loczb-comments --remote --file=schema.sql 2>&1 && {
              echo "Schema applied successfully"
              exit 0
            }
            [ "$i" -lt 3 ] && echo "Retrying in 5s..." && sleep 5
          done
          echo "Failed to apply schema after 3 attempts"
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
